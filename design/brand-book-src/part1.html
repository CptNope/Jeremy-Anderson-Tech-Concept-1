<style>
@font-face{font-family:"Archivo";src:url("../fonts/archivo-var-full.woff2") format("woff2");font-weight:400 700;font-stretch:62% 125%;font-style:normal;font-display:swap}
@font-face{font-family:"Martian Mono";src:url("../fonts/martian-mono-var.woff2") format("woff2");font-weight:400 500;font-stretch:87.5% 100%;font-style:normal;font-display:swap}
@font-face{font-family:"Archivo Fallback";src:local("Arial"),local("ArialMT"),local("Liberation Sans"),local("Roboto");size-adjust:98.4%;ascent-override:89.2%;descent-override:21.3%;line-gap-override:0%}
@font-face{font-family:"Archivo Wide Fallback";src:local("Arial"),local("ArialMT"),local("Liberation Sans"),local("Roboto");size-adjust:118%;ascent-override:74.4%;descent-override:17.8%;line-gap-override:0%}
@font-face{font-family:"Martian Mono Fallback";src:local("Menlo"),local("DejaVu Sans Mono"),local("Liberation Mono"),local("Courier New"),local("Roboto Mono");size-adjust:109.6%;ascent-override:91.2%;descent-override:18.2%;line-gap-override:0%}
/* Layout: instrument manual — fixed channel index rail at left, one reading column of "screens" (graticule panels) and spec tables on graticule-black. */
:root{
  color-scheme: dark;
  /* neutrals */
  --ink-950:#07090B; --ink-900:#0A0C0F; --ink-850:#10141A; --ink-800:#161B22; --ink-700:#222A34; --ink-600:#2E3845; --ink-500:#3D4855; --ink-450:#5A6675; --ink-400:#7D8996; --ink-300:#A3AFBC; --ink-100:#E6ECF2;
  /* channels */
  --ch1:#3CE3F0; --ch2:#9A8CFF; --ch3:#FFC23D; --ch4:#5EF0A0; --danger:#FF5C7A;
  /* paper */
  --paper:#F3F5F7; --paper-ink:#0A0C0F; --paper-muted:#465260; --ch1-deep:#007C88; --ch2-deep:#5B4BD6; --ch3-deep:#8A5800; --ch4-deep:#0A7646; --danger-deep:#B0203C;
  /* roles */
  --bg:var(--ink-900); --panel:var(--ink-850); --raised:var(--ink-800); --line:var(--ink-700); --line-strong:var(--ink-600); --line-control:var(--ink-450);
  --fg:var(--ink-100); --fg-muted:var(--ink-300); --fg-subtle:var(--ink-400); --accent:var(--ch1);
  --grid-major:rgba(159,180,200,.085); --grid-minor:rgba(159,180,200,.04);
  /* type */
  --f-display:"Archivo","Archivo Wide Fallback",Arial,sans-serif;
  --f-body:"Archivo","Archivo Fallback",Arial,sans-serif;
  --f-mono:"Martian Mono","Martian Mono Fallback",ui-monospace,Menlo,Consolas,monospace;
  /* type roles — identical to the site (DESIGN.md › Typography); specimen and statement are book-only */
  --t-display:clamp(3.25rem,1.6rem + 6vw,6rem); --t-page:clamp(2.5rem,1.5rem + 4vw,4.5rem); --t-section:clamp(1.875rem,1.3rem + 2vw,2.75rem);
  --t-title:clamp(1.375rem,1.2rem + .6vw,1.75rem); --t-item:1.125rem; --t-lede:clamp(1.125rem,1rem + .4vw,1.3125rem);
  --t-body:1.0625rem; --t-small:.9375rem; --t-label:.75rem; --t-label-long:.8125rem; --t-data:1.0625rem;
  --t-specimen:clamp(3.5rem,10vw,9rem); --t-statement:clamp(1.5rem,1.2rem + 1.2vw,2.25rem);
  --w-small:430; --measure:32em;
  /* space (4px base) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px; --s9:96px; --s10:128px;
  --r-tag:2px; --r-control:6px; --r-panel:12px;
  --ease-out:cubic-bezier(.16,1,.3,1); --t-fast:120ms; --t-base:200ms; --t-slow:320ms; --t-sweep:640ms;
  --rail:248px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:24px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);line-height:1.6;font-stretch:100%;-webkit-font-smoothing:antialiased;margin:0;padding-inline:0;font-size:var(--t-body)}
::selection{background:var(--ch1);color:var(--ink-900)}
:focus-visible{outline:2px solid var(--ch1);outline-offset:2px;border-radius:2px}
a{color:var(--ch1);text-underline-offset:.22em;text-decoration-thickness:1px}
@media (hover:hover){a:hover{text-decoration-thickness:2px}}
html{scrollbar-color:var(--ink-500) var(--ink-950)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:var(--ink-950)}::-webkit-scrollbar-thumb{background:var(--ink-600);border-radius:10px;border:2px solid var(--ink-950)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:620;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:var(--t-section);font-weight:620;font-stretch:118%;line-height:1.05;letter-spacing:-.02em}
h3{margin-top:var(--s8);margin-bottom:var(--s3);font-size:var(--t-title);font-weight:600;font-stretch:112%;line-height:1.15;letter-spacing:-.01em}
h4{margin-bottom:var(--s2);font-size:var(--t-item);font-weight:600;font-stretch:108%;line-height:1.35;letter-spacing:0}
p{margin:0 0 var(--s4);max-width:var(--measure)}
.skip{position:absolute;left:16px;top:-80px;z-index:100;background:var(--ch1);color:var(--ink-900);padding:10px 14px;border-radius:var(--r-control);font-weight:600;text-decoration:none}.skip:focus{top:52px}
h3.as-h4{margin:0 0 var(--s2);font-size:var(--t-item);font-weight:600;font-stretch:108%;line-height:1.35;letter-spacing:0}
.lede{color:var(--fg);max-width:60ch;font-size:var(--t-lede);line-height:1.5}
.muted{color:var(--fg-muted)}
.mono,.readout{font-family:var(--f-mono);font-stretch:90%}
.readout{font-size:var(--t-label);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-muted);font-variant-numeric:tabular-nums}
code{font-family:var(--f-mono);font-size:.85em;background:var(--raised);border:1px solid var(--line);padding:.05em .35em;border-radius:3px;font-stretch:90%}
.tnum{font-variant-numeric:tabular-nums}

/* rail */
.rail{position:fixed;inset:0 auto 0 0;width:var(--rail);border-right:1px solid var(--line);background:var(--ink-950);padding:var(--s5) var(--s4) var(--s5) var(--s5);overflow:auto;display:flex;flex-direction:column;gap:var(--s5);z-index:5}
.rail .lockup{width:184px;color:var(--fg);display:block}
.rail>a:first-child,.rail a[href="#top"]{display:flex;align-items:center;min-height:44px}
.rail nav ol{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.rail nav a{display:grid;grid-template-columns:2.4rem 1fr;align-items:baseline;gap:var(--s2);padding:6px 8px;border-radius:4px;color:var(--fg-muted);text-decoration:none;line-height:1.3;font-size:var(--t-small)}
.rail nav a .n{font-family:var(--f-mono);font-size:var(--t-label);color:var(--fg-subtle);font-stretch:90%}
@media (hover:hover){.rail nav a:hover{color:var(--fg);background:var(--ink-850)}}
.rail nav a[aria-current="true"]{color:var(--fg);background:var(--ink-850);box-shadow:inset 2px 0 0 var(--ch1)}
.rail nav a[aria-current="true"] .n{color:var(--ch1)}
.rail .meta{margin-top:auto}
main{margin-left:var(--rail);padding-inline:max(clamp(16px,5vw,80px), env(safe-area-inset-left,0px)) max(clamp(16px,5vw,80px), env(safe-area-inset-right,0px));padding-block:0 calc(var(--s10) + env(safe-area-inset-bottom,0px))}
@media (max-width:959px){
  .rail{position:sticky;top:env(safe-area-inset-top,0px);inset:auto;width:auto;height:auto;flex-direction:row;align-items:center;justify-content:space-between;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line);background:rgba(7,9,11,.92);backdrop-filter:blur(12px)}
  .rail nav,.rail .meta{display:none}
  .rail .lockup{width:150px}
  .rail .jump{display:block}
  main{margin-left:0}
}
.jump{display:none;font-family:var(--f-mono);font-size:var(--t-label);color:var(--fg);background:var(--ink-850);border:1px solid var(--line-control);border-radius:var(--r-control);padding:0;width:min(52vw,240px)}
.jump select{display:block;width:100%;min-height:44px;padding:0 10px;cursor:pointer;color-scheme:dark}
.jump:focus-within{outline:2px solid var(--ch1);outline-offset:2px}
.jump select:focus-visible{outline:none}

/* sections */
.section{padding-top:var(--s10);max-width:1160px;margin-inline:auto}
.sec-head{display:grid;grid-template-columns:auto 1fr;gap:var(--s5);align-items:start;padding-bottom:var(--s6);margin-bottom:var(--s7);border-bottom:1px solid var(--line);position:relative}
.sec-head::after{content:"";position:absolute;left:0;bottom:-1px;height:1px;width:96px;background:var(--ch1)}
.sec-num{font-family:var(--f-mono);color:var(--ch1);padding-top:.7em;font-stretch:90%;letter-spacing:.04em;min-width:3ch;font-size:var(--t-label-long)}
.sec-head p{margin-top:var(--s4);color:var(--fg-muted);font-size:var(--t-body)}
.cols{display:grid;gap:var(--s6) var(--s7);grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.cols>*{min-width:0}
.sec-head>*,.kv dd,.kv dt,.pillars>div,.values>div,.persona,.rewrite>div,.dodont>div,.taglines li>*{min-width:0;overflow-wrap:break-word}
@media (max-width:480px){h1,h2,h3,h4,.statement{overflow-wrap:anywhere}}
.pillars h4{flex-wrap:wrap}.screen-bar{flex-wrap:wrap}.ch{white-space:normal}
.two{display:grid;gap:var(--s6);grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.two>*{min-width:0}

/* screens: graticule panels */
.screen{position:relative;background:var(--ink-950);border:1px solid var(--line);border-radius:var(--r-panel);overflow:hidden;
  background-image:
    linear-gradient(var(--grid-major) 1px,transparent 1px),linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),
    linear-gradient(var(--grid-minor) 1px,transparent 1px),linear-gradient(90deg,var(--grid-minor) 1px,transparent 1px);
  background-size:64px 64px,64px 64px,16px 16px,16px 16px;background-position:-1px -1px}
.screen.plain{background-image:none;background-color:var(--panel)}
.screen-bar{display:flex;justify-content:space-between;gap:var(--s4);padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(16,20,26,.9)}
.screen-body{padding:var(--s6)}
.cap{margin-top:var(--s3);color:var(--fg-muted);font-size:var(--t-small)}

/* spec table */
.spec{width:100%;border-collapse:collapse;font-size:var(--t-small)}
.spec th,.spec td{text-align:left;padding:12px 14px 12px 0;border-bottom:1px solid var(--line);vertical-align:top}
.spec th{font-family:var(--f-mono);font-weight:500;font-size:var(--t-label);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-subtle);font-stretch:90%}
.spec td.mono{white-space:nowrap;font-size:var(--t-label-long)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* channel tag */
.ch{display:inline-flex;align-items:center;gap:.5em;font-family:var(--f-mono);font-size:var(--t-label);letter-spacing:.06em;text-transform:uppercase;font-stretch:90%;color:var(--fg);border:1px solid var(--line-strong);border-radius:var(--r-tag);padding:3px 7px 3px 6px;white-space:nowrap}
.ch i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--ch1));box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--ch1)) 18%,transparent)}
.ch b{font-weight:500;color:var(--c)}

/* cover */
.cover{min-height:min(860px,100svh);display:grid;grid-template-rows:1fr auto;padding-block:var(--s7) var(--s6);border-bottom:1px solid var(--line);position:relative;max-width:none;margin-inline:calc(-1*clamp(16px,5vw,80px));padding-inline:clamp(16px,5vw,80px);overflow:hidden}
.cover canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cover .graticule{position:absolute;inset:0;background-image:linear-gradient(var(--grid-major) 1px,transparent 1px),linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),linear-gradient(var(--grid-minor) 1px,transparent 1px),linear-gradient(90deg,var(--grid-minor) 1px,transparent 1px);background-size:10% 12.5%,10% 12.5%,2% 2.5%,2% 2.5%}
.cover-inner{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:var(--s5);z-index:1;pointer-events:none}
.cover h1{font-stretch:125%;font-weight:640;letter-spacing:-.035em;line-height:.88;font-size:var(--t-specimen)}
.cover .sub{max-width:44ch;color:var(--fg-muted);font-size:var(--t-lede);line-height:1.5}
.cover-strip{position:relative;z-index:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:var(--s7)}

.cover-strip div{background:rgba(7,9,11,.86);padding:12px 14px;display:grid;gap:2px}
.cover-strip .v{font-family:var(--f-mono);color:var(--fg);font-stretch:90%;font-size:var(--t-label-long)}

/* blocks */
.statement{font-family:var(--f-display);font-stretch:112%;font-size:var(--t-statement);line-height:1.2;font-weight:500;letter-spacing:-.015em;max-width:30ch;text-wrap:balance}
.statement em{font-style:normal;color:var(--ch1)}
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));border-top:1px solid var(--line)}
.pillars>div{padding:var(--s5) var(--s5) var(--s5) 0;border-bottom:1px solid var(--line)}
.pillars h4{display:flex;gap:.6em;align-items:baseline}
.pillars p{font-size:var(--t-small);color:var(--fg-muted);margin:0}
.kv{display:grid;grid-template-columns:minmax(120px,180px) 1fr;gap:var(--s3) var(--s5);margin:0}
.kv dt{font-family:var(--f-mono);font-size:var(--t-label);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-subtle);padding-top:.35em;font-stretch:90%}
.kv dd{margin:0;max-width:var(--measure)}
@media (max-width:560px){.kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:var(--s3)}}
.values{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-panel);overflow:hidden}
.values>div{background:var(--panel);padding:var(--s5)}
.values p{font-size:var(--t-small);color:var(--fg-muted);margin:0}
.persona{display:grid;gap:var(--s4);padding:var(--s5);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-panel)}
.persona header{display:flex;flex-direction:column;align-items:flex-start;gap:var(--s2)}
.persona h4,.persona h3.as-h4{margin:0;font-size:var(--t-item);font-weight:600;font-stretch:108%;line-height:1.35;letter-spacing:0}
.persona dl{margin:0;display:grid;gap:var(--s3)}
.persona dt{font-family:var(--f-mono);font-size:var(--t-label);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-subtle);font-stretch:90%}
.persona dd{margin:0;font-size:var(--t-small)}
.note{color:var(--fg-muted);border:1px dashed var(--line-strong);border-radius:8px;padding:10px 14px;max-width:var(--measure);font-size:var(--t-small)}
.dodont{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:var(--s4)}
.dodont>div{border:1px solid var(--line);border-radius:var(--r-panel);padding:var(--s5);background:var(--panel)}
.dodont .tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:var(--t-label);letter-spacing:.06em;text-transform:uppercase;margin-bottom:var(--s3);font-stretch:90%}
.dodont ul{margin:0;padding-left:1.1em;display:grid;gap:6px;font-size:var(--t-small)}
.rewrite{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--r-panel);overflow:hidden}
.rewrite>div{padding:var(--s5)}
.rewrite>div+div{border-left:1px solid var(--line);background:var(--panel)}
@media (max-width:700px){.rewrite{grid-template-columns:1fr}.rewrite>div+div{border-left:0;border-top:1px solid var(--line)}}
.taglines{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.taglines li{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:var(--s5);padding:var(--s4) 0;border-bottom:1px solid var(--line);align-items:baseline}
.taglines .t{font-family:var(--f-display);font-size:var(--t-title);font-weight:600;font-stretch:112%;line-height:1.15;letter-spacing:-.01em}
.taglines .why{font-size:var(--t-small);color:var(--fg-muted)}
.taglines li.pick .t{color:var(--ch1)}
@media (max-width:640px){.taglines li{grid-template-columns:1fr;gap:4px}}
.chart-legend{display:flex;flex-wrap:wrap;gap:var(--s3) var(--s5);margin-top:var(--s3)}

/* ===== Typeset ===== */
.readout.long{text-transform:none;letter-spacing:.01em;font-size:var(--t-label-long)}
.r-display,.r-page,.r-section,.r-title,.r-item{font-family:var(--f-display)}
.r-display{font-size:var(--t-display);font-weight:640;font-stretch:125%;line-height:.92;letter-spacing:-.035em}
.r-page{font-size:var(--t-page);font-weight:640;font-stretch:125%;line-height:.95;letter-spacing:-.03em}
.r-section{font-size:var(--t-section);font-weight:620;font-stretch:118%;line-height:1.05;letter-spacing:-.02em}
.r-title{font-size:var(--t-title);font-weight:600;font-stretch:112%;line-height:1.15;letter-spacing:-.01em}
.r-item{font-size:var(--t-item);font-weight:600;font-stretch:108%;line-height:1.35}
.r-lede{font-size:var(--t-lede);line-height:1.5}
.r-body{font-size:var(--t-body);line-height:1.6}
.r-small{font-size:var(--t-small);font-weight:var(--w-small);line-height:1.5;color:var(--fg-muted)}
.r-data{font-family:var(--f-mono);font-stretch:90%;font-size:var(--t-data);font-variant-numeric:tabular-nums}
.readout,.mono,.ch,code,.ratio,.sec-num{font-weight:400}
svg [font-family*="Martian"]{font-stretch:90%}
.cap,.note,.pillars p,.values p,.persona dd,.taglines .why,.dodont ul,.explore figcaption,.lockups figcaption,.apps figcaption,.misuse figcaption,.sw .info{font-weight:var(--w-small)}
@media (max-width:399px){:root{--t-specimen:clamp(2.75rem,14vw,3.5rem)}.cover h1{font-stretch:112%}}
/* ===== Adapt ===== */
.cover{container-type:inline-size}
@container (max-width:720px){.cover-strip{grid-template-columns:repeat(2,minmax(0,1fr))}.cover-strip div:last-child{grid-column:1/-1}}
a,button,summary,label,select{-webkit-tap-highlight-color:rgba(60,227,240,.16)}

@media (hover:none){
  .readout-strip a:active,.rail nav a:active{background:var(--ink-850)}
  .btn-copy:active{border-color:var(--ch1);color:var(--ch1)}
}
/* tables become label/value cards on phones (the contrast matrix stays a grid) */
@media (max-width:639px){
  table.stack{min-width:0!important}
  table.stack thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  table.stack,table.stack tbody,table.stack tr{display:block;width:100%}
  table.stack tr{padding:var(--s3) 0;border-bottom:1px solid var(--line)}
  table.stack td{display:grid;grid-template-columns:minmax(6.5rem,34%) minmax(0,1fr);gap:var(--s3);padding:4px 0!important;border:0!important;white-space:normal!important}
  table.stack td::before{content:attr(data-label);font-family:var(--f-mono);font-stretch:90%;font-size:var(--t-label);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-subtle);padding-top:.3em}
  table.stack td[data-label=""]{grid-template-columns:1fr}
  table.stack td[data-label=""]::before{display:none}
  table.stack td>*{justify-self:start;max-width:100%}
}
/* Print / Save as PDF: keep the instrument palette, drop the navigation, one section per page */
@media print{
  @page{size:letter landscape;margin:12mm}
  html,body{background:#0A0C0F!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cbar,.rail,.skip,.jump,.btn-copy,.tabs,#demoBtn,noscript{display:none!important}
  body{padding-top:0!important}
  main{margin-left:0!important;padding-inline:0!important}
  .cover{min-height:auto;break-after:page}
  .section{padding-top:0;max-width:none;break-before:page}
  .sec-head,.screen,figure,.persona,.price-row,tr,.sw,.values>div,.pillars>div{break-inside:avoid}
  [role=tabpanel][hidden]{display:block!important}
  .code pre{max-height:none;overflow:visible;white-space:pre-wrap}
  a{text-decoration:none}
}
</style>
